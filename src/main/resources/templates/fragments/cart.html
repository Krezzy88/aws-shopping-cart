<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <body>
    <div th:fragment="cartView">
      <h4 class="badge-pill badge-light mt-3 mb-3 p-2 text-center">
        Shopping Cart
      </h4>

      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Product</th>
            <th>Qty</th>
            <th>Subtotal</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="item : ${cartItems}">
            <td th:text="${item.product.name}"></td>

            <td th:text="${item.quantity}"></td>

            <td
              th:text="${#numbers.formatDecimal(
                item.product.price * item.quantity,
                0,'COMMA',0,'POINT'
              )} + ' VND'"
            ></td>

            <td>
              <!-- Increase quantity -->
              <form
                th:action="@{/cart/item/{id}/increase(id=${item.id})}"
                method="post"
                style="display:inline"
              >
                <input type="hidden" name="cartId" th:value="${cartId}" />
                <button class="btn btn-sm btn-success">+</button>
              </form>

              <!-- Decrease quantity -->
              <form
                th:action="@{/cart/item/{id}/decrease(id=${item.id})}"
                method="post"
                style="display:inline"
              >
                <input type="hidden" name="cartId" th:value="${cartId}" />
                <button class="btn btn-sm btn-warning">-</button>
              </form>

              <!-- Remove product -->
              <form
                th:action="@{/cart/item/{id}/remove(id=${item.id})}"
                method="post"
                style="display:inline"
              >
                <input type="hidden" name="cartId" th:value="${cartId}" />
                <button class="btn btn-sm btn-danger">x</button>
              </form>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Cart total -->
      <p class="text-right font-weight-bold">
        Total:
        <span
          th:text="${#numbers.formatDecimal(totalAmount,0,'COMMA',0,'POINT')} + ' VND'"
        ></span>
      </p>

      <!-- Clear cart -->
      <form th:action="@{/cart/{id}/clear(id=${cartId})}" method="post">
        <button class="btn btn-outline-danger btn-sm">
          Clear Cart
        </button>
      </form>
    </div>
  </body>
</html>
